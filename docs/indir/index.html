<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İndiriliyor… — Valorant Tracker</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 38%, #12161d, #05070a 72%); color: #eef2f7;
      font-family: "Inter", system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; padding: 40px; }
    .blogo { width: 86px; height: 86px; object-fit: contain; margin: 0 auto 22px; display: block;
      filter: drop-shadow(0 10px 28px rgba(111,169,230,.5)); animation: f 3s ease-in-out infinite; }
    @keyframes f { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-8px); } }
    .logo { font-size: 30px; font-weight: 700; letter-spacing: 3px; margin-bottom: 8px;
      font-family: "Space Grotesk", sans-serif; }
    .logo .ac { color: #9fc8f2; }
    .by { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: #6fa9e6; margin-bottom: 20px; }
    .msg { color: #aab3c2; font-size: 15px; line-height: 1.6; }
    .sp { width: 40px; height: 40px; margin: 0 auto 22px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.1); border-top-color: #9fc8f2; animation: s 0.9s linear infinite; }
    a { color: #9fc8f2; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <img class="blogo" src="../assets/logo.webp" alt="Blackbit" />
    <div class="sp"></div>
    <div class="logo">VALORANT<span class="ac">TRACKER</span></div>
    <div class="by">by Blackbit</div>
    <div class="msg" id="msg">İndirme hazırlanıyor…</div>
  </div>
  <script>
    (function () {
      var REPO = 'erensezen2/cltrpulse-releases';
      fetch('https://api.github.com/repos/' + REPO + '/releases/latest')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var exe = d && (d.assets || []).find(function (a) { return /\.exe$/i.test(a.name); });
          if (exe && exe.browser_download_url) {
            document.getElementById('msg').innerHTML = 'İndirme başladı. Başlamazsa <a href="' + exe.browser_download_url + '">buraya tıkla</a>.';
            window.location.href = exe.browser_download_url;
          } else {
            document.getElementById('msg').textContent = 'İndirme bulunamadı, lütfen tekrar dene.';
          }
        })
        .catch(function () { document.getElementById('msg').textContent = 'Bağlantı hatası, lütfen tekrar dene.'; });
    })();
  </script>

  <script>
  (function(){
    var EP="https://illegalculture.org/api/pulse/track";
    fetch("https://api.github.com/repos/erensezen2/cltrpulse-releases/releases/latest")
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){var v=(d&&d.tag_name)?d.tag_name.replace(/^v/,""):"-";
        fetch(EP,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({event:"download",id:"web",version:v,os:"web"}),keepalive:true}).catch(function(){});})
      .catch(function(){});
  })();
  </script>
</body>
</html>
