<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İndiriliyor… — CLTR PULSE</title>
  <meta name="robots" content="noindex" />
  <style>
    html, body { margin: 0; height: 100%; background: #040405; color: #ececf1;
      font-family: "Inter", system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; padding: 40px; }
    .logo { font-size: 30px; font-weight: 800; letter-spacing: 1px; margin-bottom: 18px;
      font-family: "Space Grotesk", sans-serif; }
    .logo .ac { color: #ff2d6f; }
    .msg { color: #8b8b99; font-size: 15px; line-height: 1.6; }
    .sp { width: 40px; height: 40px; margin: 0 auto 20px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.1); border-top-color: #ff2d6f; animation: s 0.9s linear infinite; }
    a { color: #ff6a9c; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="sp"></div>
    <div class="logo">CLTR<span class="ac">PULSE</span></div>
    <div class="msg" id="msg">İndirme hazırlanıyor…</div>
  </div>
  <script>
    (function () {
      var REPO = 'erensezen2/cltrpulse-releases';
      fetch('https://api.github.com/repos/' + REPO + '/releases/latest')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var exe = d && (d.assets || []).find(function (a) { return /\.exe$/i.test(a.name); });
          if (exe && exe.browser_download_url) {
            document.getElementById('msg').innerHTML = 'İndirme başladı. Başlamazsa <a href="' + exe.browser_download_url + '">buraya tıkla</a>.';
            window.location.href = exe.browser_download_url;
          } else {
            document.getElementById('msg').textContent = 'İndirme bulunamadı, lütfen tekrar dene.';
          }
        })
        .catch(function () { document.getElementById('msg').textContent = 'Bağlantı hatası, lütfen tekrar dene.'; });
    })();
  </script>
</body>
</html>
